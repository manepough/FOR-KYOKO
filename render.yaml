services:
  - type: web             # ✅ free tier available
    name: kyoko-bot
    runtime: python
    pythonVersion: "3.12"  # pin to 3.12 — audiooop removed in 3.13+
    buildCommand: pip install -r requirements.txt
    startCommand: python kyoko.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: GROQ_TOKEN_1
        sync: false
      - key: GROQ_TOKEN_2
        sync: false
      - key: GROQ_TOKEN_3
        sync: false
      - key: GROQ_TOKEN_4
        sync: false
      - key: GROQ_TOKEN_5
        sync: false
      - key: OPENAI_TOKEN
        sync: false
